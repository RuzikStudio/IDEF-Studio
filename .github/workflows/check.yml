name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: New-Item -ItemType Directory -Force test-results
      - run: node tests/examples-ui.cjs
      - run: node tests/idef1x-ui.cjs
      - run: npx electron-builder --win nsis --x64
      - run: node tests/ports-ui.cjs "release/win-unpacked/IDEF Studio.exe"
      - run: node tests/local-mixed-ui.cjs "release/win-unpacked/IDEF Studio.exe"
      - run: node tests/block-routing-ui.cjs "release/win-unpacked/IDEF Studio.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: IDEF-Studio-Windows-x64
          path: release/win-unpacked/
      - uses: actions/upload-artifact@v7
        with:
          name: IDEF-Studio-Windows-x64-Setup
          path: release/*-Setup.exe
          if-no-files-found: error

  macos:
    if: github.ref == 'refs/tags/v0.6.1'
    uses: ./.github/workflows/macos.yml

  release:
    if: github.ref == 'refs/tags/v0.6.1'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IDEF-Studio-Windows-x64
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: IDEF-Studio-Windows-x64-Setup
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: IDEF-Studio-macOS-arm64
          path: assets
      - name: Package the portable Windows build
        run: |
          cd windows
          test -f 'IDEF Studio.exe'
          zip -qr ../assets/IDEF-Studio-Windows-x64.zip .
      - name: Publish v0.6.1
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: assets
        run: |
          set -euo pipefail
          sha256sum *.exe *.dmg *.zip > SHA256.txt
          cat > notes.md <<'EOF'
          Выпрямление стрелок одной командой, общий цвет и подпись ветвей, изменение размеров блоков и развёрнутый холст по F11.

          - **Windows x64:** запустите Setup. Для запуска без установки распакуйте весь ZIP и откройте IDEF Studio.exe.
          - **macOS, Apple Silicon:** откройте DMG и перенесите IDEF Studio в папку «Программы». Сборка подписана локальной подписью ad hoc.
          EOF
          gh release create "$GITHUB_REF_NAME" *.exe *.dmg *.zip SHA256.txt --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "IDEF Studio 0.6.1" --notes-file notes.md
