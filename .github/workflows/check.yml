name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: New-Item -ItemType Directory -Force test-results
      - run: node tests/examples-ui.cjs
      - run: node tests/idef1x-ui.cjs
      - run: npx electron-builder --win dir
      - uses: actions/upload-artifact@v4
        with:
          name: IDEF-Studio-Windows-x64
          path: release/win-unpacked/

