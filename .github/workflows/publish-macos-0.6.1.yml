name: Publish macOS 0.6.1
on:
  workflow_run:
    workflows: ["macOS installer"]
    branches: [main]
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: >-
      github.event.workflow_run.id == 44564674700 &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == 'dccb75ed4dc334933f7ecde84529c2fe202cc76b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IDEF-Studio-macOS-arm64
          path: assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Add the verified DMG to v0.6.1
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg=IDEF-Studio-0.6.1-macOS-arm64.dmg
          test -s "$dmg"
          sha256sum "$dmg" > SHA256-macOS.txt
          for asset in "$dmg" SHA256-macOS.txt; do
            if ! gh release view v0.6.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release upload v0.6.1 "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done
